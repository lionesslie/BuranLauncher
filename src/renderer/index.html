<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data:; style-src 'self' 'unsafe-inline'; script-src 'self';" />
<title>Buran Launcher</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- Arkaplan katmanı: Ayarlar'dan değiştirilebilir/kapatılabilir -->
  <div id="bg-layer"></div>

  <!-- Özel Title Bar -->
  <div class="titlebar">
    <div class="titlebar-account" id="titlebar-account">
      <div class="account-avatar" id="titlebar-avatar"></div>
      <span id="titlebar-username">—</span>
    </div>
    <div class="titlebar-drag"></div>
    <div class="titlebar-controls">
      <button class="win-btn" id="btn-minimize" title="Simge durumuna küçült">&#8211;</button>
      <button class="win-btn" id="btn-maximize" title="Büyüt/Geri yükle">&#9633;</button>
      <button class="win-btn win-btn-close" id="btn-close" title="Kapat">&#10005;</button>
    </div>
  </div>

  <div class="app-shell">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-logo">Buran</div>
      <ul class="sidebar-nav">
        <li data-page="home" class="active"><span class="icon" data-icon="home"></span><span class="label" data-i18n="sidebar.home"></span></li>
        <li data-page="profiles"><span class="icon" data-icon="layout-grid"></span><span class="label" data-i18n="sidebar.profiles"></span></li>
        <li data-page="modstore"><span class="icon" data-icon="puzzle"></span><span class="label" data-i18n="sidebar.modstore"></span></li>
        <li data-page="modpacks"><span class="icon" data-icon="package"></span><span class="label" data-i18n="sidebar.modpacks"></span></li>
        <li data-page="installedmods"><span class="icon" data-icon="list"></span><span class="label" data-i18n="sidebar.installedMods"></span></li>
        <li data-page="resources"><span class="icon" data-icon="image"></span><span class="label" data-i18n="sidebar.resources"></span></li>
        <li data-page="worlds"><span class="icon" data-icon="globe"></span><span class="label" data-i18n="sidebar.worlds"></span></li>
        <li data-page="serverhost"><span class="icon" data-icon="server"></span><span class="label" data-i18n="sidebar.serverhost"></span></li>
        <li data-page="accounts"><span class="icon" data-icon="users"></span><span class="label" data-i18n="sidebar.accounts"></span></li>
        <li data-page="settings"><span class="icon" data-icon="settings"></span><span class="label" data-i18n="sidebar.settings"></span></li>
      </ul>
    </nav>

    <!-- Ana içerik -->
    <main class="content">
      <section id="page-home" class="page active"></section>
      <section id="page-profiles" class="page"></section>
      <section id="page-modstore" class="page"></section>
      <section id="page-modpacks" class="page"></section>
      <section id="page-installedmods" class="page"></section>
      <section id="page-resources" class="page"></section>
      <section id="page-worlds" class="page"></section>
      <section id="page-serverhost" class="page"></section>
      <section id="page-accounts" class="page"></section>
      <section id="page-settings" class="page"></section>
    </main>
  </div>

  <!-- Log paneli (alt açılır) -->
  <div class="log-panel" id="log-panel">
    <div class="log-panel-header">
      <div class="log-panel-header-row1">
        <span class="log-panel-title" data-i18n="log.title"></span>
        <div class="log-header-spacer"></div>
        <button id="log-expand" title="">⤢</button>
        <button id="log-clear" data-i18n="log.clear"></button>
        <button id="log-toggle">▾</button>
      </div>
      <div class="log-panel-header-row2">
        <div class="log-filters" id="log-filters">
          <button class="log-filter-btn active" data-filter="all" data-i18n="log.filters.all"></button>
          <button class="log-filter-btn" data-filter="error" data-i18n="log.filters.error"></button>
          <button class="log-filter-btn" data-filter="warn" data-i18n="log.filters.warn"></button>
          <button class="log-filter-btn" data-filter="game" data-i18n="log.filters.game"></button>
          <button class="log-filter-btn" data-filter="system" data-i18n="log.filters.system"></button>
        </div>
        <input type="search" id="log-search" class="log-search" data-i18n-placeholder="log.searchPlaceholder" />
      </div>
    </div>
    <div class="log-panel-body" id="log-output"></div>
    <button class="log-jump-bottom" id="log-jump-bottom" style="display:none;" data-i18n="log.jumpToBottom"></button>
  </div>

  <!-- Toast konteyneri -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Modal konteyneri -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal-box"></div>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/log.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/profiles.js"></script>
  <script src="js/pages/modstore.js"></script>
  <script src="js/pages/modpacks.js"></script>
  <script src="js/pages/installedmods.js"></script>
  <script src="js/pages/resources.js"></script>
  <script src="js/pages/worlds.js"></script>
  <script src="js/pages/serverhost.js"></script>
  <script src="js/pages/accounts.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
