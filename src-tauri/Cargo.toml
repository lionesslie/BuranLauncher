[package]
name = "buran-launcher"
version = "1.0.0"
description = "Buran Launcher - Minecraft başlatıcı"
authors = ["Buran Launcher"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buran_launcher_core"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "sync", "time", "io-util", "fs", "macros"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
uuid = { version = "1", features = ["v4"] }
md5 = "0.7"
sha1 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
aes-gcm = "0.10"
base64 = "0.22"
rand = "0.8"
open = "5"
dotenvy = "0.15"
sys-locale = "0.3"
chrono = "0.4"
discord-rich-presence = "0.2"
futures-util = "0.3"
semver = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
